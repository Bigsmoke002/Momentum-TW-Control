<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0080FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D2FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E232E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0F13;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="54" fill="url(#bgGrad)" stroke="#2A303C" stroke-width="4"/>
  <!-- Headphone Arc -->
  <path d="M 64 128 A 64 64 0 0 1 192 128" fill="none" stroke="url(#grad1)" stroke-width="16" stroke-linecap="round"/>
  <!-- Left Earbud -->
  <rect x="52" y="120" width="24" height="48" rx="12" fill="#00D2FF" />
  <circle cx="64" cy="144" r="6" fill="#0D0F13" />
  <!-- Right Earbud -->
  <rect x="180" y="120" width="24" height="48" rx="12" fill="#00D2FF" />
  <circle cx="192" cy="144" r="6" fill="#0D0F13" />
  <!-- Sennheiser Logo Stylized S Wave -->
  <path d="M 104 180 Q 128 160 128 180 Q 128 200 152 180" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
</svg>
